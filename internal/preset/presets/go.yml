preset: go
# only the vet checks go test runs itself: lint findings such as
# unreachable code after a fake-it return don't break the build
build: go vet -atomic -bool -buildtags -directive -errorsas -ifaceassert -nilfunc -printf -stringintconv -tests ./...
test:
  cmd: go test -json ./...
results: { format: go-json }
tests: ["**/*_test.go"]
sources: ["**/*.go"]
ignore: [".tddtrainer/**", "vendor/**"]
tpp_order: iteration-first
slow_run_warning: 5s

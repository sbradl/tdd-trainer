name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Archives hold only the binary: `tddt setup` fetches the llama.cpp
# libraries pinned to it, and the model.
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -ldflags "-s -w" -o dist/tddt/ ./cmd/tddt
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
      - run: cp README.md LICENSE dist/tddt/
      - name: archive
        run: |
          name=tddt-${{ github.ref_name }}-${{ matrix.goos }}-amd64
          if [ "${{ matrix.goos }}" = windows ]; then
            (cd dist && zip -qr "../$name.zip" tddt)
          else
            tar -C dist -czf "$name.tar.gz" tddt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}
          path: tddt-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum tddt-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tddt-*
            SHA256SUMS
